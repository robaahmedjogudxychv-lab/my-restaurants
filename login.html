 
<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول / إنشاء حساب</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="../css/bootstrap.min.css">

  <!-- CSS المشروع -->
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body dir="rtl">

  <div class="container my-5">

    <div class="row justify-content-center">

      <!-- ===== تسجيل الدخول ===== -->
      <div class="col-lg-5 col-md-7 col-12 mb-4">
        <div class="card shadow p-4 login-card">
          <h3 class="text-center mb-4">تسجيل الدخول</h3>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">اسم المستخدم</label>
              <input type="text" id="loginUsername" class="form-control" placeholder="ادخل اسم المستخدم">
            </div>
            <div class="mb-3 position-relative">
              <label class="form-label">كلمة المرور</label>
              <input type="password" id="loginPassword" class="form-control" placeholder="ادخل كلمة المرور">
              
              <button type="button" id="toggleLoginPassword" class="btn btn-sm btn-outline-secondary position-absolute end-0 top-0 mt-0 me-2">👁</button>
            </div>
            <button type="submit" class="btn btn-primary w-100">دخول</button>
            <div class="text-center mt-3">
              <a href="#" data-bs-toggle="modal" data-bs-target="#signupModal">إنشاء حساب جديد</a>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>

  <!-- ===== Modal إنشاء حساب ===== -->
  <div class="modal fade" id="signupModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-4">
        <h4 class="text-center mb-3">إنشاء حساب جديد</h4>
        <form id="signupForm">
          <div class="mb-3">
            <label class="form-label">اسم المستخدم</label>
            <input type="text" id="signupUsername" class="form-control" placeholder="ادخل اسم المستخدم">
          </div>
          <div class="mb-3">
            <label class="form-label">البريد الإلكتروني</label>
            <input type="email" id="signupEmail" class="form-control" placeholder="ادخل بريدك الإلكتروني">
          </div>
          <div class="mb-3 position-relative">
            <label class="form-label">كلمة المرور</label>
            <input type="password" id="signupPassword" class="form-control" placeholder="ادخل كلمة المرور">
            <button type="button" id="toggleSignupPassword" class="btn btn-sm btn-outline-secondary position-absolute end-0 top-0 mt-2 me-2">👁</button>
          </div>
          <button type="submit" class="btn btn-success w-100">إنشاء الحساب</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS محلي -->
  <script src="../js/bootstrap.bundle.min.js"></script>

  <!-- JS المشروع -->
  <script src="../js/scripts.js"></script>

</body>
</html>
